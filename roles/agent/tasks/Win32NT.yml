---
- name: "{{ ansible_facts['system'] }}: Run OS Family specific tasks."
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"
  tags:
    - always

- name: "{{ ansible_facts['system'] }}: Check for Agent Controller Binary."
  ansible.windows.win_stat:
    path: "{{ __checkmk_agent_controller_binary_path }}"
  register: __checkmk_agent_controller_binary
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Check for Agent Binary."
  ansible.windows.win_stat:
    path: "{{ __checkmk_agent_binary_path }}"
  register: __checkmk_agent_binary
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Read Updater State."
  ansible.windows.win_command: powershell.exe -
  args:
    stdin: Get-Content -ErrorAction Ignore -LiteralPath C:\ProgramData\checkmk\agent\config\cmk-update-agent.state ; Exit 0
  register: __checkmk_agent_updater_state
  changed_when: false
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Read Agent Controller State."
  ansible.windows.win_command: powershell.exe -
  args:
    stdin: Get-Content -ErrorAction Ignore -LiteralPath C:\ProgramData\checkmk\agent\registered_connections.json ; Exit 0
  register: __checkmk_agent_registered_connections
  changed_when: false
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Register Agent for automatic Updates using User Password."
  ansible.windows.win_command: |
    check_mk_agent.exe updater register -H {{ checkmk_agent_host_name }} \
    -s {{ checkmk_agent_registration_server }} -i {{ checkmk_agent_registration_site }} -p {{ checkmk_agent_server_protocol }} \
    -U {{ checkmk_agent_user }} -P {{ __checkmk_agent_auth | ansible.windows.quote }}
  no_log: "{{ checkmk_agent_no_log | bool }}"
  register: __checkmk_agent_update_state
  args:
    chdir: "C:\\Program Files (x86)\\checkmk\\service\\"
  when: |
    checkmk_agent_edition | lower != "community"
    and __checkmk_agent_binary.stat.exists | bool
    and checkmk_agent_update | bool
    and (checkmk_agent_pass is defined and checkmk_agent_pass | length > 0)
    and (checkmk_agent_secret is not defined)
    and not (('\'server\': \'' + checkmk_agent_registration_server + '\', \'site\': \'' + checkmk_agent_registration_site + '\'' in __checkmk_agent_updater_state.stdout)
    and ('\'last_error\': None' in __checkmk_agent_updater_state.stdout))
  changed_when: "'Successfully registered agent of host' in __checkmk_agent_update_state.stderr"
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Register Agent for automatic Updates using Automation Secret."
  ansible.windows.win_command: |
    check_mk_agent.exe updater register -H {{ checkmk_agent_host_name }} \
    -s {{ checkmk_agent_registration_server }} -i {{ checkmk_agent_registration_site }} -p {{ checkmk_agent_registration_server_protocol }} \
    -U {{ checkmk_agent_user }} -S {{ __checkmk_agent_auth | ansible.windows.quote }}
  no_log: "{{ checkmk_agent_no_log | bool }}"
  register: __checkmk_agent_update_state
  args:
    chdir: "C:\\Program Files (x86)\\checkmk\\service\\"
  when: |
    checkmk_agent_edition | lower != "community"
    and __checkmk_agent_binary.stat.exists | bool
    and checkmk_agent_update | bool
    and (checkmk_agent_secret is defined and checkmk_agent_secret | length > 0)
    and not (('\'server\': \'' + checkmk_agent_registration_server + '\', \'site\': \'' + checkmk_agent_registration_site + '\'' in __checkmk_agent_updater_state.stdout)
    and ('\'last_error\': None' in __checkmk_agent_updater_state.stdout))
  changed_when: "'Successfully registered agent of host' in __checkmk_agent_update_state.stderr"
  tags:
    - register-agent

# ---------------------------------------------------------------------------
# Direct TLS registration
# ---------------------------------------------------------------------------

- name: "{{ ansible_facts['system'] }}: Register Agent for TLS diretly."
  ansible.windows.win_command: |
    cmk-agent-ctl.exe register -H {{ checkmk_agent_host_name }} \
    -s {{ checkmk_agent_registration_server }} -i {{ checkmk_agent_registration_site }} \
    -U {{ checkmk_agent_user }} -P {{ __checkmk_agent_auth | ansible.windows.quote }} --trust-cert
  no_log: "{{ checkmk_agent_no_log | bool }}"
  register: __checkmk_agent_tls_state
  args:
    chdir: "C:\\Program Files (x86)\\checkmk\\service\\"
  when:
    - __checkmk_agent_controller_binary.stat.exists | bool
    - checkmk_agent_tls | bool
    - not checkmk_agent_delegate_registration | bool
    - __checkmk_agent_auth is defined
    - __checkmk_agent_auth | length > 0
    - checkmk_agent_registration_server + '/' + checkmk_agent_registration_site not in __checkmk_agent_registered_connections.stdout
  changed_when: "'Registration complete' in __checkmk_agent_tls_state.stdout"
  tags:
    - register-agent

# ---------------------------------------------------------------------------
# Delegated TLS registration
# ---------------------------------------------------------------------------

- name: "{{ ansible_facts['system'] }}: Gather facts from registration target."
  ansible.builtin.setup:
    gather_subset:
      - min
  delegate_to: "{{ checkmk_agent_delegate_registration_target }}"
  register: __checkmk_agent_delegate_facts
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Check proxy-register binary on Linux registration target."
  ansible.builtin.stat:
    path: "{{ __checkmk_agent_controller_binary_path }}"
  register: __checkmk_agent_delegate_linux_controller_binary
  delegate_to: "{{ checkmk_agent_delegate_registration_target }}"
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_delegate_facts.ansible_facts['ansible_system'] == 'Linux'
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Check proxy-register binary on Windows registration target."
  ansible.windows.win_stat:
    path: "{{ __checkmk_agent_controller_binary_path }}"
  register: __checkmk_agent_delegate_windows_controller_binary
  delegate_to: "{{ checkmk_agent_delegate_registration_target }}"
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_delegate_facts.ansible_facts['ansible_system'] == 'Win32NT'
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Register Agent for TLS with proxy-register on Linux target."
  become: true
  ansible.builtin.shell: |
    cmk-agent-ctl proxy-register -H {{ checkmk_agent_host_name }} \
    -s {{ checkmk_agent_registration_server }} -i {{ checkmk_agent_registration_site }} \
    -U {{ checkmk_agent_user }} -P {{ __checkmk_agent_auth | ansible.builtin.quote }} --trust-cert
  no_log: "{{ checkmk_agent_no_log | bool }}"
  register: __checkmk_agent_proxy_registration_linux
  delegate_to: "{{ checkmk_agent_delegate_registration_target }}"
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_delegate_facts.ansible_facts['ansible_system'] == 'Linux'
    - (__checkmk_agent_delegate_linux_controller_binary.stat.exists | default(false) | bool)
    - __checkmk_agent_auth is defined
    - __checkmk_agent_auth | length > 0
    - checkmk_agent_registration_server + '/' + checkmk_agent_registration_site not in __checkmk_agent_registered_connections.stdout
  changed_when: "'-----BEGIN PRIVATE KEY-----' in __checkmk_agent_proxy_registration_linux.stdout"
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Register Agent for TLS with proxy-register on Windows target."
  ansible.windows.win_command: |
    cmk-agent-ctl.exe proxy-register -H {{ checkmk_agent_host_name }} `
    -s {{ checkmk_agent_registration_server }} -i {{ checkmk_agent_registration_site }} `
    -U {{ checkmk_agent_user }} -P {{ __checkmk_agent_auth | ansible.windows.quote }} --trust-cert
  no_log: "{{ checkmk_agent_no_log | bool }}"
  register: __checkmk_agent_proxy_registration_windows
  args:
    chdir: "C:\\Program Files (x86)\\checkmk\\service\\"
  delegate_to: "{{ checkmk_agent_delegate_registration_target }}"
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_delegate_facts.ansible_facts['ansible_system'] == 'Win32NT'
    - (__checkmk_agent_delegate_windows_controller_binary.stat.exists | default(false) | bool)
    - __checkmk_agent_auth is defined
    - __checkmk_agent_auth | length > 0
    - checkmk_agent_registration_server + '/' + checkmk_agent_registration_site not in __checkmk_agent_registered_connections.stdout
  changed_when: "'-----BEGIN PRIVATE KEY-----' in __checkmk_agent_proxy_registration_windows.stdout"
  tags:
    - register-agent

# ---------------------------------------------------------------------------
# Import delegated registration on original Windows agent
# ---------------------------------------------------------------------------

- name: "{{ ansible_facts['system'] }}: Create temporary file for delegated Agent registration."
  ansible.windows.win_tempfile:
    state: file
    suffix: ".registration"
  register: __checkmk_agent_proxy_registration_tempfile
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - >
      (
        __checkmk_agent_proxy_registration_linux.stdout is defined
        and __checkmk_agent_proxy_registration_linux.stdout | length > 0
      )
      or
      (
        __checkmk_agent_proxy_registration_windows.stdout is defined
        and __checkmk_agent_proxy_registration_windows.stdout | length > 0
      )
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Write delegated Agent registration to temporary file."
  ansible.windows.win_copy:
    content: >-
      {{
        __checkmk_agent_proxy_registration_linux.stdout
        if __checkmk_agent_proxy_registration_linux.stdout is defined
        else __checkmk_agent_proxy_registration_windows.stdout
      }}
    dest: "{{ __checkmk_agent_proxy_registration_tempfile.path }}"
  no_log: "{{ checkmk_agent_no_log | bool }}"
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_proxy_registration_tempfile.path is defined
    - >
      (
        __checkmk_agent_proxy_registration_linux.stdout is defined
        and __checkmk_agent_proxy_registration_linux.stdout | length > 0
      )
      or
      (
        __checkmk_agent_proxy_registration_windows.stdout is defined
        and __checkmk_agent_proxy_registration_windows.stdout | length > 0
      )
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Import delegated Agent registration."
  ansible.windows.win_command: |
    cmk-agent-ctl.exe import {{ __checkmk_agent_proxy_registration_tempfile.path }}
  no_log: "{{ checkmk_agent_no_log | bool }}"
  register: __checkmk_agent_tls_state
  args:
    chdir: "C:\\Program Files (x86)\\checkmk\\service\\"
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_proxy_registration_tempfile.path is defined
  changed_when: "'Registration complete' in __checkmk_agent_tls_state.stdout"
  tags:
    - register-agent


- name: "{{ ansible_facts['system'] }}: Remove temporary delegated Agent registration file."
  ansible.windows.win_file:
    path: "{{ __checkmk_agent_proxy_registration_tempfile.path }}"
    state: absent
  when:
    - checkmk_agent_tls | bool
    - checkmk_agent_delegate_registration | bool
    - __checkmk_agent_proxy_registration_tempfile.path is defined
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Verify Checkmk Agent Port is open."
  ansible.windows.win_wait_for:
    port: "{{ checkmk_agent_port }}"
    timeout: 60
  when: checkmk_agent_mode == 'pull'
  tags:
    - register-agent

- name: "{{ ansible_facts['system'] }}: Initial push of data for push agent."  # noqa no-changed-when
  become: true
  ansible.windows.win_command: cmk-agent-ctl.exe push
  when: checkmk_agent_mode == 'push'
  tags:
    - register-agent